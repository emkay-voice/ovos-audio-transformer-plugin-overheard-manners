[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-audio-transformer-plugin-overheard-manners"
version = "0.1.0a1"
description = "OpenVoiceOS audio transformer: the assistant gently comments on swearing it overhears in the room - spotted and checked on the device, nothing recorded or sent"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "emkay-voice"}]
maintainers = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "plugin", "audio-transformer", "good-manners", "swearing", "keyword-spotting", "wakephonehubert", "privacy", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-plugin-manager>=2.0.0",
    "ovos-utils>=0.8.0",
    "ovos-bus-client>=1.0.0",
    "ovos-config>=0.0.12",
    "numpy",
    # stage 1: WakePhoneHuBERT zero-shot spotting (the model is fetched on first use)
    "ovos-ww-plugin-wakeforge>=0.18.0a1",
    # stage 2: the word lists
    "ovos-good-manners-pipeline-plugin>=0.0.2",
]

[project.optional-dependencies]
test = ["pytest"]
# to rebuild the phrase files (scripts/build_phrases.py); not needed at runtime
build = ["phonemizer==3.4.0", "espeakng-loader==0.2.4"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-audio-transformer-plugin-overheard-manners"
Issues = "https://github.com/emkay-voice/ovos-audio-transformer-plugin-overheard-manners/issues"
Emkay = "https://github.com/emkay-voice/emkay"

[project.entry-points."opm.transformer.audio"]
ovos-audio-transformer-plugin-overheard-manners = "ovos_audio_transformer_plugin_overheard_manners:OverheardMannersPlugin"

[tool.setuptools]
packages = ["ovos_audio_transformer_plugin_overheard_manners"]

[tool.setuptools.package-data]
ovos_audio_transformer_plugin_overheard_manners = ["locale/*/*.json", "locale/*/*.dialog", "locale/*/*.voc"]
